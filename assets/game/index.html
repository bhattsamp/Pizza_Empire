<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pizza Empire – Merge &amp; Cook</title>
<style>
:root{--cream:#FFF4E0;--tomato:#D7263D;--tomatoD:#A3172A;--basil:#2E7D32;--basilL:#E6F6E0;--wood:#B9783F;--woodD:#8A5528;
--cellA:#F6E1BE;--cellB:#F1D6A8;--gold:#FFC233;--goldD:#E59A00;--ink:#3B2414;--sky:#4FA3E0;--plum:#7B3FA0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#2b1a10;color:var(--ink);overflow:hidden;touch-action:none;
font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}
button{font-family:inherit}
#app{max-width:480px;margin:0 auto;height:100%;position:relative;background:var(--cream);overflow:hidden}
.screen{display:none;flex-direction:column;height:100%;position:absolute;inset:0}
.screen.on{display:flex}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--goldD);border-radius:20px;padding:3px 9px;font-weight:800;font-size:14px;white-space:nowrap}
.pulse{animation:pulse .25s}@keyframes pulse{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:800;background:var(--basil);color:#fff;cursor:pointer;box-shadow:0 4px 0 #1b5e20}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1b5e20}
.btn.red{background:var(--tomato);box-shadow:0 4px 0 var(--tomatoD)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--goldD)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}

#splash .logo,#splash h1,#splash p{display:none}
#splash::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(transparent,#0008);pointer-events:none}
#playBtn{position:relative;z-index:1;animation:nudge 1.2s infinite}
#splash .logo{font-size:110px;animation:spin 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 10px #0006)}
@keyframes spin{50%{transform:rotate(18deg) scale(1.08)}}
#splash h1{font-size:40px;margin:10px 0 0;font-weight:900;text-shadow:0 4px 0 #8a1020;letter-spacing:1px}
#splash p{margin:4px 0 26px;font-weight:800;opacity:.95}
/* home */
#home{background:linear-gradient(#8fd3ff,#cfeeff 30%,#e9f7d8 60%,#b9e19a)}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 12px 6px}
.topbar h1{flex:1;margin:0;font-size:20px;font-weight:900;color:var(--tomato);text-shadow:0 2px 0 #fff}
.scroll{flex:1;overflow-y:auto;touch-action:pan-y;padding-bottom:14px}
.outlet{position:relative;margin:10px 16px;border-radius:22px;padding:12px;display:flex;gap:12px;align-items:center;background:#fff;box-shadow:0 5px 0 #0002,0 8px 16px #0002;cursor:pointer}
.outlet .bld{width:74px;height:74px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#ffe3a3,#ffb74d);flex-shrink:0}
.outlet.locked{filter:grayscale(.85);opacity:.85}
.outlet.cur{outline:4px solid var(--gold)}
.outlet h3{margin:0;font-size:16px}.outlet small{display:block;opacity:.7;font-size:12px}
.outlet .pbar{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-top:6px}.outlet .pbar i{display:block;height:100%;background:var(--basil)}
.navbar{display:flex;justify-content:space-around;background:#fff;border-top:3px solid var(--cellB);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.navbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:22px;cursor:pointer;color:var(--ink);padding:2px 4px;position:relative}
.navbar button span{font-size:10px;font-weight:800;margin-top:1px}
.dot{position:absolute;top:0;right:4px;width:9px;height:9px;border-radius:50%;background:var(--tomato)}
/* stages */
#stages{background:linear-gradient(#ffe0b2,var(--cream) 40%,#dcefd0)}
.back{border:0;background:#fff;border-radius:12px;width:38px;height:38px;font-size:20px;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 #0002;flex-shrink:0}
.snode{display:flex;flex-direction:column;align-items:center;width:130px;margin:6px auto;cursor:pointer}
.snode.l{transform:translateX(-62px)}.snode.r{transform:translateX(62px)}
.snode .bub{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;
background:linear-gradient(135deg,var(--tomato),var(--tomatoD));border:4px solid #fff;box-shadow:0 4px 8px #0004}
.snode.boss .bub{background:linear-gradient(135deg,var(--plum),#4a1f66);width:84px;height:84px}
.snode.lock .bub{background:linear-gradient(135deg,#bdbdbd,#757575)}
.snode.cur .bub{border-color:var(--gold);animation:bob 1.3s infinite}
@keyframes bob{50%{transform:translateY(-5px) scale(1.05)}}
.snode small{font-size:11px;font-weight:700;text-align:center;margin-top:3px}
.st{font-size:17px;letter-spacing:1px;color:#0002}.st .on{color:var(--gold)}
/* game */
#game{background:var(--cream)}
.ghead{display:flex;align-items:center;gap:6px;padding:6px 8px 2px}
.gtitle{flex:1;min-width:0;line-height:1.1}
.gtitle small{color:var(--tomato);font-weight:800;font-size:10px;display:block}
.gtitle b{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.objs{display:flex;gap:4px;padding:2px 8px;overflow-x:auto;touch-action:pan-x;flex-shrink:0}
.obj{flex-shrink:0;background:#fff;border:2px solid var(--cellB);border-radius:10px;padding:2px 7px;font-size:11px;font-weight:800;white-space:nowrap}
.obj.ok{background:var(--basilL);border-color:var(--basil);color:var(--basil)}
.obj.timer{border-color:var(--tomato);color:var(--tomato)}
#scene3d{display:block;width:calc(100% - 16px);margin:3px 8px 0;height:clamp(120px,21vh,210px);border-radius:14px;flex-shrink:0;touch-action:none;background:#2b1a10;box-shadow:0 3px 8px #0004}
.custs{display:flex;gap:5px;padding:4px 8px;height:84px;flex-shrink:0}
.cust{flex:1;min-width:0;background:#fff;border:2px solid var(--cellB);border-radius:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 2px 5px;cursor:pointer;box-shadow:0 2px 4px #0002}
@keyframes walkin{from{transform:translateX(60px);opacity:0}}
.cust.sel{border-color:var(--tomato);border-width:3px}
.cust.cooking{background:#FFF8E1}
.cust.eating{background:var(--basilL)}
.cust .face{font-size:18px;line-height:1}
.cust .tp{position:absolute;left:4px;top:3px;font-size:12px}
.cust .qty{position:absolute;right:4px;top:3px;font-size:10px;font-weight:900;background:var(--gold);border-radius:8px;padding:0 4px}
.cust .rname{font-size:10px;font-weight:800;text-align:center;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pat{width:86%;height:5px;background:#eee;border-radius:4px;overflow:hidden}.pat i{display:block;height:100%;background:var(--basil)}
.cust .price{font-size:10px;font-weight:900;color:var(--goldD)}
.cust.empty{border-style:dashed;background:transparent;box-shadow:none;color:#0004;justify-content:center;font-size:11px;font-weight:800;animation:none}
.kitchen{display:flex;gap:6px;padding:3px 8px;flex-shrink:0}
.asm{flex:1;min-width:0;background:linear-gradient(#fff,#fdf3e3);border:2px solid var(--wood);border-radius:14px;padding:4px 6px;display:flex;flex-direction:column;gap:3px;min-height:76px}
.asm.drop{outline:3px solid var(--gold)}
.asm .hd{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:900}
.asm .hd .x{margin-left:auto;border:0;background:#eee;border-radius:8px;font-size:11px;cursor:pointer;padding:1px 6px}
.slots{display:flex;flex-wrap:wrap;gap:2px}
.slot{width:28px;height:28px;border-radius:8px;border:2px dashed #c9a77c;display:flex;align-items:center;justify-content:center;opacity:.55;position:relative}
.slot.f{border:2px solid var(--basil);background:var(--basilL);opacity:1}
.slot.f::after{content:"";}
.ovens{display:flex;gap:4px}

/* =====================================================================
   STAGE PROGRESSION – 100 stages generated from chapter rules
   ===================================================================== */
function chapterMult(ch){return 1+0.15*ch;}
function unlockedRecipes(n){return RECIPES.filter(r=>r.unlock<=n);}
function estOrder(n){const u=unlockedRecipes(n),ch=Math.floor((n-1)/10);
  const avg=u.slice(-4).reduce((s,r)=>s+r.price,0)/Math.min(4,u.length);return avg*chapterMult(ch)*1.15;}
const MAKE_ITEM=['c3','onion2','paneer2','pep2','d4','c4','chick2','d5','truf2','c4'];
const UP_GOAL=[['oven',1],['tables',1],['pack',1],['riders',1],['ovenSlots',1],['gen',3],['tables',3],['ovenSlots',2],['pack',3],['oven',4]];
function r10(x){return Math.max(10,Math.round(x/10)*10);}
function buildStage(n){
  const ch=Math.floor((n-1)/10),p=(n-1)%10,C=CHAPTERS[ch];
  const U=unlockedRecipes(n),newest=U[U.length-1],prev=U[Math.max(0,U.length-2)],older=U[Math.max(0,U.length-3-(p%3))]||U[0];
  const S=3+Math.round(ch*0.5+p*0.35), E=estOrder(n);
  const key=C.key==='any'?['take','dine','deliv'][p%3]:C.key;
  let o=[],time=null;
  switch(p){
    case 0:o=[{t:'serve',n:S},{t:'recipe',r:newest.id,n:2}];break;
    case 1:o=[{t:'recipe',r:newest.id,n:Math.max(2,Math.round(S*0.6))},{t:'earn',n:r10(E*S*0.7)}];break;
    case 2:o=[{t:'perfect',n:2+Math.floor(ch/2)},{t:'serve',n:S}];break;
    case 3:o=[{t:'type',k:key,n:Math.max(2,S-1)},{t:'earn',n:r10(E*S*0.8)}];break;
    case 4:o=[{t:'upgrade',u:UP_GOAL[ch][0],l:UP_GOAL[ch][1]},{t:'serve',n:S+1}];break;
    case 5:o=[{t:'make',i:MAKE_ITEM[ch]},{t:'recipe',r:prev.id,n:2},{t:'serve',n:S}];break;
    case 6:o=[{t:'serve',n:S+1},{t:'nolose'}];break;
    case 7:o=[{t:'serve',n:S}];time=Math.round(S*55+40);break;
    case 8:o=[{t:'recipe',r:newest.id,n:2},{t:'recipe',r:older.id===newest.id?prev.id:older.id,n:2},{t:'perfect',n:3}];break;
    case 9:{let tgt=0;for(let k=ch*10+1;k<=ch*10+9;k++){const s2=3+Math.round(ch*0.5+((k-1)%10)*0.35);tgt+=estOrder(k)*s2;}
      o=[{t:'revenue',n:r10(tgt*0.55/50*50)},{t:'serve',n:S+2},{t:'perfect',n:3}];time=null;break;}
  }
  // hand-tuned tutorial stages (chapter 1)
  if(n===1)o=[{t:'recipe',r:'marg',n:3},{t:'serve',n:3},{t:'earn',n:80}];
  if(n===2)o=[{t:'bake',n:5},{t:'type',k:'take',n:3},{t:'earn',n:150}];
  if(n===3)o=[{t:'make',i:'c3'},{t:'serve',n:5}];
  if(n===5)o=[{t:'upgrade',u:'oven',l:1},{t:'serve',n:8}];
  if(n===10)o=[{t:'revenue',n:1000},{t:'upgrade',u:'storage',l:1},{t:'serve',n:6}];
  if(n===100)o=[{t:'revenue',n:r10(estOrder(100)*60)},{t:'recipe',r:'ultimate',n:2},{t:'serve',n:10},{t:'perfect',n:5}];
  const diff=Math.min(5,1+Math.floor(ch/2)+(p===9?1:0));
  return {n,ch,p,title:TITLES[ch][p],obj:o,time,maxLost:p===6?0:(ch<2?4:3),spawn:Math.max(5,C.spawn-p*0.25),
    maxO:C.maxO,reward:30+n*8,diff,recipes:U.map(r=>r.id),boss:p===9,equip:UP_GOAL[ch]};
}

function tone(f,d,type,vol,slide,when){const a=audio();if(!a||!P.sound)return;const t=a.currentTime+(when||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);}

      <small>${s.title}${s.time?' ⏱':''}</small><div class="st">${[0,1,2].map(i=>`<span class="${i<done?'on':''}">★</span>`).join('')}</div></div>`);}
  $('stageList').innerHTML=html.join('');
}
$('stageList').addEventListener('click',e=>{const s=e.target.closest('.snode');if(!s)return;const n=+s.dataset.n;
  if(!stageOpen(n))return toast('Finish the previous stage first');stageIntro(n);});
$('stBack').onclick=()=>{renderHome();show('home');};
function objText(o){switch(o.t){
  case 'serve':return `Serve ${o.n} customers`;case 'recipe':return `Serve ${o.n} × ${R[o.r].n}`;
  case 'earn':return `Earn ${fmt(o.n)} coins`;case 'perfect':return `Bake ${o.n} perfect pizzas`;
  case 'bake':return `Bake ${o.n} pizzas`;case 'type':return `Complete ${o.n} ${{take:'takeaway',dine:'dine-in',deliv:'delivery'}[o.k]} orders`;
  case 'upgrade':{const u=UPGRADES.find(x=>x.id===o.u);return `Upgrade ${u.n} to Lv ${o.l}`;}
  case 'make':return `Merge a ${ITEMS[o.i].n}`;case 'nolose':return `Don't lose any customer`;
  case 'revenue':return `Reach ${fmt(o.n)} outlet revenue`;}}
function stageIntro(n){
  const s=STAGES[n-1],newR=RECIPES.filter(r=>r.unlock===n);
  const lockUp=s.obj.find(o=>o.t==='upgrade');
  openModal(`<button class="close" id="mx">✕</button><h2>Stage ${n}</h2><p class="center" style="margin:0"><b>${s.title}</b> ${s.boss?'<span class="tag">BOSS</span>':''} <span class="tag" style="background:#eee">Difficulty ${'🌶️'.repeat(s.diff)}</span></p>
   ${newR.length?`<p class="center">🆕 New recipe: <b>${newR.map(r=>r.n).join(', ')}</b></p>`:''}
   <ul class="objList">${s.obj.map(o=>`<li>🎯 ${objText(o)}</li>`).join('')}${s.time?`<li>⏱ Time limit: ${Math.floor(s.time/60)}:${String(s.time%60).padStart(2,'0')}</li>`:''}<li>😠 Max customers lost: ${s.maxLost}</li></ul>
   <p class="center" style="margin:4px">Reward: 🪙 ${s.reward} + star bonus</p>
   ${lockUp?'<p class="center" style="font-size:12px;opacity:.75">Tip: open 🔧 Upgrades during the stage.</p>':''}
   <button class="btn" style="width:100%" id="mStart">Start Cooking ▶</button>`);
  $('mx').onclick=closeModal;$('mStart').onclick=()=>{closeModal();startStage(n);};
}

/* =====================================================================
   GAME STATE MANAGER
   ===================================================================== */
const COLS=6;let G=null,cellSize=50,loopT=null,lastTs=0;
function rows(){return 5+upL('storage');}
function ovenCount(){return 1+upL('ovenSlots');}
function tableCount(){return CHAPTERS[G.ch].tables===0?0:2+upL('tables');}
function riderCount(){return 1+upL('riders');}
function genMax(){return 5+2*upL('gen');}
function genRecharge(){return 3.0*Math.pow(.85,upL('gen'));}
function bakeTime(r){return R[r].bake*(1-0.12*upL('oven'));}

function startStage(n){
  const s=STAGES[n-1],N=COLS*rows();
  G={n,s,ch:s.ch,board:Array(N).fill(null),gens:{},charge:{},sel:null,done:false,
    orders:[],nextOrderIn:1.2,oid:1,asm:null,ovens:Array(ovenCount()).fill(null),tray:[],pid:1,riders:[],
    st:{served:0,earned:0,perfect:0,bake:0,take:0,dine:0,deliv:0,recipe:{},made:{},lost:0,sat:0,satN:0},
    time:s.time,pop:new Set(),startRev:P.stats[s.ch].rev,paused:false};
  const gens=GEN_ORDER.filter(g=>GENS[g].unlock<=n);
  gens.forEach((g,i)=>{const slot=(rows()-1)*COLS+i;G.gens[slot]=g;G.charge[slot]={n:genMax(),t:0};});
  G.board[0]='coin1';
  P.lastOutlet=s.ch;
  $('gSub').textContent=`${CHAPTERS[s.ch].e} Stage ${n} · ${CHAPTERS[s.ch].n}`;$('gName').textContent=s.title;
  show('game');sizeBoard();renderAll();if(S3)S3.reset();
  cancelAnimationFrame(loopT);lastTs=performance.now();loopT=requestAnimationFrame(loop);
}
function sizeBoard(){const r=$('boardWrap').getBoundingClientRect();cellSize=Math.floor(Math.min((r.width-18)/COLS,(r.height-14)/rows()));
  cellSize=Math.max(30,cellSize);$('board').style.setProperty('--c',cellSize+'px');}
window.addEventListener('resize',()=>{if(G&&$('game').classList.contains('on')){sizeBoard();renderBoard();}});

/* ---------- objectives ---------- */
function objProgress(o){const st=G.st;switch(o.t){
  case 'serve':return[st.served,o.n];case 'recipe':return[st.recipe[o.r]||0,o.n];case 'earn':return[st.earned,o.n];
  case 'perfect':return[st.perfect,o.n];case 'bake':return[st.bake,o.n];case 'type':return[st[o.k],o.n];
  case 'upgrade':return[Math.min(upL(o.u),o.l),o.l];case 'make':return[st.made[o.i]?1:0,1];
  case 'nolose':return[st.lost===0?1:0,1];case 'revenue':return[Math.min(P.stats[G.ch].rev,o.n),o.n];}}
function objDone(o){if(o.t==='nolose')return true;const[a,b]=objProgress(o);return a>=b;}
function renderObjs(){
  const h=G.s.obj.map(o=>{const[a,b]=objProgress(o);const ok=o.t==='nolose'?G.st.lost===0:a>=b;
    const label={serve:'🙂',recipe:'🍕',earn:'🪙',perfect:'🔥',bake:'♨️',type:'📋',upgrade:'🔧',make:'✨',nolose:'💚',revenue:'📈'}[o.t];
    const txt=o.t==='recipe'?R[o.r].n:o.t==='make'?ITEMS[o.i].n:o.t==='type'?{take:'Takeaway',dine:'Dine-in',deliv:'Delivery'}[o.k]:o.t==='upgrade'?UPGRADES.find(x=>x.id===o.u).n+' Lv'+o.l:o.t==='nolose'?'No walkouts':'';
    return `<span class="obj ${ok?'ok':''}">${label} ${txt} ${o.t==='nolose'||o.t==='make'||o.t==='upgrade'?(ok?'✓':''):fmt(Math.min(a,b))+'/'+fmt(b)}</span>`;}).join('');
  const tm=G.time!=null?`<span class="obj timer">⏱ ${Math.floor(G.time/60)}:${String(Math.max(0,Math.floor(G.time%60))).padStart(2,'0')}</span>`:'';
  $('objs').innerHTML=tm+h+`<span class="obj" style="${G.st.lost?'color:var(--tomato)':''}">😠 ${G.st.lost}/${G.s.maxLost}</span>`;
}
function checkWin(){if(G.done)return;if(G.s.obj.every(objDone)){G.done=true;setTimeout(complete,700);}}

/* ---------- customers (Customer AI + Order Management) ---------- */
function freeTables(){return tableCount()-G.orders.filter(o=>o.type==='dine').length;}
function pickType(){
  const C=CHAPTERS[G.ch],w=Object.assign({},C.types);
  if(w.dine&&freeTables()<=0)delete w.dine;
  if(!w.dine&&!w.take&&!w.deliv)w.take=1;
  for(const o of G.s.obj)if(o.t==='type'&&!objDone(o)&&w[o.k])w[o.k]*=3;
  const tot=Object.values(w).reduce((a,b)=>a+b,0);let x=Math.random()*tot;
  for(const k in w){x-=w[k];if(x<=0)return k;}return Object.keys(w)[0];
}
function pickRecipe(){
  const wanted=G.s.obj.filter(o=>o.t==='recipe'&&!objDone(o)).map(o=>o.r);
  const inPipe=r=>G.orders.filter(o=>o.r===r).length;
  const need=wanted.filter(r=>inPipe(r)<2);
  if(need.length&&Math.random()<.65)return pick(need);
  const U=G.s.recipes.map(id=>R[id]);const w=U.map((r,i)=>r.pop+(i>=U.length-2?3:0));
  let x=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<U.length;i++){x-=w[i];if(x<=0)return U[i].id;}return U[0].id;
}
function spawnOrder(){
  const C=CHAPTERS[G.ch],type=pickType(),r=pickRecipe();
  let qty=1;if(type==='take'&&C.bulk&&G.s.p>=2&&Math.random()<C.bulk)qty=2;if(type==='dine'&&C.group&&Math.random()<C.group)qty=2;
  const vip=C.vip&&Math.random()<C.vip;
  const effort=R[r].need.reduce((a,x)=>a+Math.pow(2,ITEMS[x].lv-1),0);
  // patience: 3 min on Stage 1, shrinking ~0.9s per stage (≈1.5 min by Stage 100); complex recipes never get less than their prep time
  const stageBase=180-(G.n-1)*0.9, prepNeed=40+effort*4+R[r].bake*1.5;
  const pat=Math.max(stageBase,prepNeed)*(qty>1?1.6:1)*(vip?.85:1);
  const price=Math.round(R[r].price*chapterMult(G.ch)*(vip?1.5:1));
  G.orders.push({id:G.oid++,type,r,qty,assigned:0,done:0,quals:[],vip,price,pat,maxPat:pat,state:'wait',face:vip?'🤴':(C.intl?pick(INTL_FACES):pick(FACES)),eat:0});
  SFX.arrive();
}
function customerLeaves(o){
  if(S3)S3.mood[o.id]='angry';G.orders=G.orders.filter(x=>x!==o);G.st.lost++;G.st.satN++;SFX.bad();toast(`😠 ${o.face} left without food!`);
  if(G.asm&&G.asm.oid===o.id){returnAsm();}
  if(G.st.lost>G.s.maxLost&&!G.done){G.done=true;setTimeout(()=>fail('Too many customers walked out.'),500);}
}
function tapOrder(id){
  const o=G.orders.find(x=>x.id===id);if(!o||G.done)return;
  if(o.state==='eat')return toast(`${o.face} is enjoying the pizza 😋`);
  if(o.assigned>=o.qty)return toast('This order is already being cooked');
  if(G.asm){if(G.asm.oid===o.id)return;if(G.asm.filled.some(Boolean))return toast('Finish or ✖ cancel the pizza on the counter first');}
  G.asm={oid:o.id,r:o.r,filled:R[o.r].need.map(()=>false)};SFX.pop();renderAll();
}
function returnAsm(){
  if(!G.asm)return;const need=R[G.asm.r].need;
  G.asm.filled.forEach((f,i)=>{if(f){const t=nearestFree(G.board.length-1);if(t!=null){G.board[t]=need[i];G.pop.add(t);}}});
  G.asm=null;
}

/* ---------- merge engine ---------- */
function combine(a,b){if(a!==b)return null;return ITEMS[a].next||null;}
function nearestFree(from){let t=null,d=1e9;for(let i=0;i<G.board.length;i++){if(G.board[i]||(i in G.gens))continue;
  const dd=Math.abs(Math.floor(i/COLS)-Math.floor(from/COLS))+Math.abs(i%COLS-from%COLS);if(dd<d){d=dd;t=i;}}return t;}
function genPool(g){
  const def=GENS[g];if(def.out){
    if(upL('gen')>=2&&Math.random()<0.12*(upL('gen')-1))return ITEMS[def.out].next;return def.out;}
  const avail=new Set();G.s.recipes.forEach(r=>R[r].need.forEach(x=>{if(ITEMS[x].cat===def.cat)avail.add(x.slice(0,-1)+'1');}));
  let pool=[...avail];if(!pool.length)return null;
  // bias toward toppings wanted by current orders / counter
  const want=new Set();G.orders.forEach(o=>R[o.r].need.forEach(x=>{if(ITEMS[x].cat===def.cat)want.add(x.slice(0,-1)+'1');}));
  const w=[...want];if(w.length&&Math.random()<.75)pool=w;return pick(pool);
}
function produce(slot){
  const c=G.charge[slot];if(c.n<=0){SFX.bad();return toast(`${GENS[G.gens[slot]].n} is recharging… ⏳`);}
  const t=nearestFree(slot);if(t==null){SFX.bad();return toast('Board is full! Merge, use or sell items.');}
  const id=Math.random()<.06?'coin1':genPool(G.gens[slot]);if(!id)return;
  c.n--;G.board[t]=id;G.pop.add(t);SFX.pop();vib(8);G.sel=slot;markMade(id);renderBoard();renderInfo();renderCusts();
}
function markMade(id){G.st.made[id]=1;}
function drop(from,to){
  if(G.done||from===to||(to in G.gens))return;const a=G.board[from],b=G.board[to];if(!a)return;
  if(!b){G.board[to]=a;G.board[from]=null;}
  else{const r=combine(a,b);
    if(r){G.board[from]=null;G.board[to]=r;G.pop.add(to);SFX.merge();vib(20);P.totals.merges++;markMade(r);
      if(ITEMS[r].lv>=3&&!ITEMS[r].coin){/* tiny reward for deep merges */}}
    else if(a!==b){G.board[to]=a;G.board[from]=b;
      const needA=G.asm&&R[G.asm.r].need.some((x,j)=>x===a&&!G.asm.filled[j]);
      toast(needA?`Only identical items merge here. Drag ${ITEMS[a].n} up onto the Prep Counter (or just tap it) to add it to the pizza.`:`Only 2 identical items merge. Different ingredients are combined on the Prep Counter: tap a customer, then tap the glowing ingredients.`);}
    else{toast(`${ITEMS[a].n} is already max level`);}
  }
  G.sel=to;renderAll();checkWin();
}
function collect(i){const d=ITEMS[G.board[i]];flyCoins(cellEl(i),Math.min(4+(d.v>>2),12),d.v);vib(15);
  G.board[i]=null;if(G.sel===i)G.sel=null;earn(d.v);renderAll();checkWin();}
function sell(i){const id=G.board[i];if(!id)return;const v=Math.max(1,Math.floor(ITEMS[id].v/2));flyCoins(cellEl(i),2,v);G.board[i]=null;G.sel=null;earn(v);renderAll();}
function earn(v){P.coins+=v;G.st.earned+=v;P.stats[G.ch].rev+=v;P.totals.earned+=v;save();setCoins();}

/* ---------- pizza preparation & cooking system ---------- */
function addToAsm(i){
  if(!G.asm)return false;const id=G.board[i],need=R[G.asm.r].need;
  const k=need.findIndex((x,j)=>x===id&&!G.asm.filled[j]);if(k<0)return false;
  G.asm.filled[k]=true;G.board[i]=null;if(G.sel===i)G.sel=null;SFX.pop();vib(10);renderAll();return true;
}
function bakeAsm(){
  if(!G.asm||!G.asm.filled.every(Boolean))return;
  const slot=G.ovens.findIndex(x=>!x);if(slot<0){SFX.bad();return toast('All ovens are busy 🔥');}
  const o=G.orders.find(x=>x.id===G.asm.oid);
  G.ovens[slot]={pid:G.pid++,r:G.asm.r,oid:G.asm.oid,t:0,bake:bakeTime(G.asm.r)};
  if(o){o.assigned++;o.state='cook';}
  G.asm=null;SFX.oven();renderAll();
}
function ovenQuality(ov){const x=ov.t/ov.bake;return x<1?'under':x<1.6?'perfect':'burnt';}
function tapOven(i){
  const ov=G.ovens[i];if(!ov)return toast('Oven is empty – prepare a pizza on the counter');
  const x=ov.t/ov.bake;
  if(x<.5)return toast('Still raw! Wait for the green zone 🟩');
  takeOut(i);
}
function takeOut(i){
  const ov=G.ovens[i],q=ovenQuality(ov);G.ovens[i]=null;
  if(q==='burnt'){SFX.bad();toast('🔥 Burnt! The order needs a new pizza.');const o=G.orders.find(x=>x.id===ov.oid);if(o){o.assigned--;if(o.assigned<=o.done)o.state='wait';}renderAll();return;}
  G.st.bake++;if(q==='perfect'){G.st.perfect++;P.totals.perfect++;SFX.ding();}else toast('Undercooked… customer will pay less');
  G.tray.push({pid:ov.pid,r:ov.r,oid:ov.oid,q,step:'baked',auto:0});renderAll();checkWin();
}
function trayAct(pid,act){
  const p=G.tray.find(x=>x.pid===pid);if(!p)return;let o=G.orders.find(x=>x.id===p.oid);
  if(!o||o.state==='eat'){o=G.orders.find(x=>x.r===p.r&&x.state!=='eat'&&x.done<x.qty&&x.assigned<=x.done+0)||G.orders.find(x=>x.r===p.r&&x.state!=='eat'&&x.done<x.qty);
    if(o){p.oid=o.id;o.assigned++;}}
  if(act==='slice'){p.step='sliced';SFX.slice();}
  else if(act==='pack'){p.step='packed';SFX.pack();}
  else if(act==='sell'){const v=Math.round(R[p.r].price*chapterMult(G.ch)*.5);G.tray=G.tray.filter(x=>x!==p);flyCoins($('tray'),4,v);earn(v);renderAll();return;}
  else if(act==='serve'||act==='hand'){if(!o)return;deliverPizza(p,o);return;}
  else if(act==='dispatch'){if(!o)return;if(G.riders.length>=riderCount())return toast('All riders are out 🛵');
    G.tray=G.tray.filter(x=>x!==p);G.riders.push({oid:o.id,t:Math.max(3,6-upL('riders')*1.2),q:p.q});o.state='deliv';SFX.pack();renderAll();return;}
  renderAll();
}
function deliverPizza(p,o){
  G.tray=G.tray.filter(x=>x!==p);o.done++;o.quals.push(p.q);G.st.recipe[o.r]=(G.st.recipe[o.r]||0)+1;
  if(o.done>=o.qty){if(o.type==='dine'){o.state='eat';o.eat=3;}else payOrder(o);}
  else o.state='wait';
  renderAll();checkWin();
}
function payOrder(o){
  const qf=o.quals.reduce((s,q)=>s+(q==='perfect'?1:.7),0)/o.quals.length;
  const pr=Math.max(0,o.pat/o.maxPat);
  let base=o.price*o.qty*qf*(hasStaff('manager')?1.1:1);
  let tip=base*0.3*pr*(hasStaff('cashier')?1.25:1)+(o.quals.every(q=>q==='perfect')?base*.1:0);
  if(o.type!=='dine')base*=1+0.05*upL('pack');if(o.type==='deliv')base*=1.15;
  const total=Math.round(base+tip);
  const el=document.querySelector(`.cust[data-o="${o.id}"]`)||$('custs');
  flyCoins(el,Math.min(5+Math.floor(total/15),16),total);earn(total);
  if(S3)S3.mood[o.id]='happy';G.orders=G.orders.filter(x=>x!==o);G.st.served++;G.st[o.type]++;P.totals.orders++;if(o.type==='deliv')P.totals.deliv++;
  const sat=Math.round((40+60*pr)*qf);G.st.sat+=sat;G.st.satN++;P.stats[G.ch].orders++;P.stats[G.ch].sat+=sat;P.stats[G.ch].satN++;
  save();checkAch();renderAll();checkWin();
}

/* ---------- main loop ---------- */
let renderAcc=0;
function loop(ts){
  const dt=Math.min(.25,(ts-lastTs)/1000);lastTs=ts;loopT=requestAnimationFrame(loop);
  if(G&&S3&&$('game').classList.contains('on'))S3.update(dt);
  if(!G||G.paused||$('modalBg').classList.contains('on')&&!G.done)return;
  if(G.done)return;
  // generators
  for(const s in G.charge){const c=G.charge[s];if(c.n<genMax()){c.t+=dt;if(c.t>=genRecharge()){c.t=0;c.n++;}}else c.t=0;}
  // spawn customers
  G.nextOrderIn-=dt;const active=G.orders.length;
  if(G.nextOrderIn<=0){if(active<G.s.maxO){spawnOrder();renderCusts();}G.nextOrderIn=G.s.spawn*(active===0?.3:1);}
  if(active===0&&G.nextOrderIn>2)G.nextOrderIn=2;
  // patience & eating
  for(const o of [...G.orders]){
    if(o.state==='eat'){o.eat-=dt;if(o.eat<=0)payOrder(o);continue;}
    if(o.state==='deliv')continue;
    o.pat-=dt*(o.state==='cook'?.5:1);if(o.pat<=0)customerLeaves(o);
  }
  // ovens
  let ovChanged=false;
  G.ovens.forEach((ov,i)=>{if(!ov)return;const before=ovenQuality(ov);ov.t+=dt;const after=ovenQuality(ov);
    if(before!==after){ovChanged=true;if(after==='perfect')SFX.ding();if(after==='burnt')SFX.bad();}
    if(hasStaff('chef')&&ov.t/ov.bake>=1.15)takeOut(i);});
  // riders
  for(const rd of [...G.riders]){rd.t-=dt;if(rd.t<=0){G.riders=G.riders.filter(x=>x!==rd);const o=G.orders.find(x=>x.id===rd.oid);
    if(o){o.done++;o.quals.push(rd.q);G.st.recipe[o.r]=(G.st.recipe[o.r]||0)+1;payOrder(o);}}}
  // staff automation
  for(const p of [...G.tray]){p.auto+=dt;if(p.auto<1)continue;const o=G.orders.find(x=>x.id===p.oid);
    if(p.step==='baked'&&hasStaff('asst')){p.auto=0;trayAct(p.pid,'slice');}
    else if(p.step==='sliced'&&o&&o.type!=='dine'&&hasStaff('packer')){p.auto=0;trayAct(p.pid,'pack');}
    else if(p.step==='sliced'&&o&&o.type==='dine'&&hasStaff('waiter')){p.auto=0;trayAct(p.pid,'serve');}
    else if(p.step==='packed'&&o&&o.type==='take'&&hasStaff('packer')){p.auto=0;trayAct(p.pid,'hand');}
    else if(p.step==='packed'&&o&&o.type==='deliv'&&hasStaff('rider')&&G.riders.length<riderCount()){p.auto=0;trayAct(p.pid,'dispatch');}}
  // timer
  if(G.time!=null){G.time-=dt;if(G.time<=0&&!G.done){G.done=true;fail('Time is up!');}}
  renderAcc+=dt;if(renderAcc>.2||ovChanged){renderAcc=0;liveUpdate();}
}
function liveUpdate(){
  // light-weight updates without rebuilding the board (keeps drag smooth)
  G.orders.forEach(o=>{const el=document.querySelector(`.cust[data-o="${o.id}"] .pat i`);if(el){const r=Math.max(0,o.pat/o.maxPat);el.style.width=(r*100)+'%';el.style.background=r>.5?'#2E7D32':r>.25?'#F9A825':'#D7263D';}});
  renderOvens();renderObjs();
  for(const s in G.charge){const el=document.querySelector(`.cell[data-i="${s}"] .gen`);if(!el)continue;const c=G.charge[s];
    el.classList.toggle('empty',c.n<=0);el.querySelector('.ch').textContent=c.n;el.querySelector('.cd').style.width=(c.n>=genMax()?0:c.t/genRecharge()*100)+'%';}
  const rd=document.querySelectorAll('.cust .rider');rd.forEach(e=>{const o=G.riders.find(x=>x.oid===+e.dataset.o);if(o)e.textContent=`🛵 ${Math.ceil(o.t)}s`;});
  if(!drag)renderCusts();
}

/* ---------- rendering ---------- */
function renderAll(){setCoins();renderObjs();renderCusts();renderAsm();renderOvens();renderTray();renderBoard();renderInfo();}
const TYPE_IC={take:'🛍️',dine:'🍽️',deliv:'🛵'};
function trayFor(o){return G.tray.find(p=>p.oid===o.id);}
function nextAct(p,o){if(p.step==='baked')return['slice','✂️ Slice',''];
  if(p.step==='sliced')return o.type==='dine'?['serve','🍽 Serve','g']:['pack','📦 Pack',''];
  return o.type==='deliv'?['dispatch','🛵 Send','g']:['hand','🤝 Give','g'];}
function renderCusts(){
  const slots=Math.max(G.s.maxO,G.orders.length);let h='';
  for(let i=0;i<slots;i++){const o=G.orders[i];
    if(!o){h+=`<div class="cust empty">${G.done?'':'🚶 next customer…'}</div>`;continue;}
    const r=Math.max(0,o.pat/o.maxPat),col=r>.5?'#2E7D32':r>.25?'#F9A825':'#D7263D';
    const sel=G.asm&&G.asm.oid===o.id,p=trayFor(o);
    let bottom=`<div class="price">🪙 ${fmt(o.price*o.qty)}${o.vip?' 👑':''}</div>`;
    if(p){const a=nextAct(p,o);bottom=`<button class="go ${a[2]}" data-p="${p.pid}" data-a="${a[0]}">${a[1]}</button>`;}
    else if(o.state==='eat')bottom=`<div class="price" style="color:var(--basil)">😋 eating…</div>`;
    else if(o.state==='deliv')bottom=`<div class="price rider" data-o="${o.id}" style="color:var(--sky)">🛵 on the way</div>`;
    else if(!sel&&o.assigned<o.qty&&!G.asm)bottom=`<div class="hint">👆 Tap to cook</div>`;
    h+=`<div class="cust ${sel?'sel':''} ${o.state==='cook'?'cooking':''} ${o.state==='eat'?'eating':''}" data-o="${o.id}">
      <span class="tp">${TYPE_IC[o.type]}</span>${o.qty>1?`<span class="qty">×${o.qty}${o.done?' ('+o.done+')':''}</span>`:''}
      <div class="top">${o.face}${R[o.r].e}</div><div class="rname">${R[o.r].n}</div>
      ${o.state==='eat'||o.state==='deliv'?'':`<div class="pat"><i style="width:${r*100}%;background:${col}"></i></div>`}${bottom}</div>`;}
  const sig=h.replace(/width:[\d.]+%;background:#\w+/g,'');
  if($('custs')._sig!==sig){$('custs')._sig=sig;$('custs').innerHTML=h;}
}
function renderAsm(){
  if(!G.asm){setH($('asm'),`<div class="empty"><span>👆</span>Tap a customer above to start their pizza</div>`);return;}
  const r=R[G.asm.r],need=r.need,ready=G.asm.filled.every(Boolean);
  setH($('asm'),`<div class="hd">${r.e} ${r.n}<button class="x" id="asmX">✖</button></div>
    <div class="row2"><div class="slots" style="flex:1">${need.map((x,j)=>`<div class="slot ${G.asm.filled[j]?'f':''}" title="${ITEMS[x].n}">${itemHTML(x,28)}</div>`).join('')}</div>
    ${ready?`<button class="btn red bake" id="bakeBtn">🔥 Bake</button>`:''}</div>
    ${ready?'':'<div style="font-size:11px;font-weight:700;opacity:.65">Tap the glowing ingredients on the board</div>'}`);
  $('asmX').onclick=()=>{returnAsm();renderAll();};
  if(ready)$('bakeBtn').onclick=bakeAsm;
}
function renderOvens(){
  const n=ovenCount();let h='';
  for(let i=0;i<n;i++){const ov=G.ovens[i];
    if(!ov){h+=`<div class="oven" data-ov="${i}"><div class="door">⬛</div><div>Oven ${i+1}</div><div class="obar"></div></div>`;continue;}
    const q=ovenQuality(ov),x=ov.t/ov.bake;
    h+=`<div class="oven ${q==='burnt'?'burnt':'baking'} ${q==='perfect'?'perfect':''}" data-ov="${i}"><div class="door">${q==='burnt'?'⚫':'🍕'}</div>
      <div>${q==='under'?Math.ceil(ov.bake-ov.t)+'s':q==='perfect'?'TAP NOW!':'BURNT ✖'}</div><div class="obar"><i style="width:${Math.min(100,x/1.6*100)}%"></i></div></div>`;}
  const spare=G.tray.filter(p=>!G.orders.some(o=>o.id===p.oid&&o.state!=='eat'));
  spare.forEach(p=>{const m=G.orders.find(o=>o.r===p.r&&o.state!=='eat'&&o.state!=='deliv'&&o.done<o.qty&&!trayFor(o));
    h+=`<div class="spare"><span style="font-size:22px">${R[p.r].e}</span>${m?`<button data-sp="${p.pid}" data-to="${m.id}">➡️ ${m.face}</button>`:`<button data-sp="${p.pid}">💰 Sell</button>`}</div>`;});

function renderTray(){renderCusts();renderOvens();}
function setH(el,h){if(el._h!==h){el._h=h;el.innerHTML=h;}}
const cellEl=i=>$('board').querySelector(`.cell[data-i="${i}"]`);
function wantedSet(){const s=new Set();if(G.asm){const need=R[G.asm.r].need;need.forEach((x,j)=>{if(!G.asm.filled[j])s.add(x);});}return s;}
function renderBoard(){
  const s=cellSize-4,want=wantedSet();let h='';
  for(let i=0;i<G.board.length;i++){
    const cls=((Math.floor(i/COLS)+i%COLS)%2?'b':'a')+(G.sel===i?' sel':'');let inner='',w='';
    if(i in G.gens){const g=GENS[G.gens[i]],c=G.charge[i];inner=`<div class="gen ${c.n<=0?'empty':''}"><span style="font-size:${s*.55}px">${g.e}</span><span class="ch">${c.n}</span><span class="cd"></span></div>`;}
    else if(G.board[i]){inner=itemHTML(G.board[i],Math.round(s*.95),true);if(G.pop.has(i))inner=inner.replace('class="it','class="popin it');if(want.has(G.board[i]))w=' want';}

function hint(id){const d=ITEMS[id];if(d.coin)return `Tap to collect ${d.v} coins${d.next?' · merge 2 for more!':''}`;

function tapCell(i){
  if(G.done)return;if(i in G.gens){G.sel=i;produce(i);return;}
  const id=G.board[i];if(!id){G.sel=null;renderBoard();renderInfo();return;}
  if(ITEMS[id].coin){collect(i);return;}
  if(addToAsm(i))return;
  G.sel=i;renderBoard();renderInfo();
}
let drag=null;
$('board').addEventListener('pointerdown',e=>{audio();const c=e.target.closest('.cell');if(!c||!G||G.done)return;
  drag={i:+c.dataset.i,x:e.clientX,y:e.clientY,moved:false,ghost:null,over:null,asm:false};$('board').setPointerCapture(e.pointerId);});
$('board').addEventListener('pointermove',e=>{
  if(!drag)return;const i=drag.i,can=G.board[i]&&!(i in G.gens);
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8&&can){drag.moved=true;
    const g=document.createElement('div');g.className='ghost';g.innerHTML=itemHTML(G.board[i],cellSize-4);document.body.appendChild(g);drag.ghost=g;
    cellEl(i).classList.add('drag');G.sel=i;renderInfo();}
  if(drag.moved){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
    const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest('.cell');const over=c?+c.dataset.i:null;
    const onAsm=!!(el&&el.closest('#asm'));if(onAsm!==drag.asm){$('asm').classList.toggle('drop',onAsm);drag.asm=onAsm;}
    if(over!==drag.over){if(drag.over!=null)cellEl(drag.over)?.classList.remove('hover');if(over!=null&&over!==i&&!(over in G.gens))cellEl(over)?.classList.add('hover');drag.over=over;}}
});
function endDrag(){if(!drag)return;const d=drag;drag=null;if(d.ghost)d.ghost.remove();$('asm').classList.remove('drop');
  if(!d.moved){tapCell(d.i);return;}
  if(d.asm){if(!addToAsm(d.i)){toast(G.asm?'That ingredient is not needed for this pizza':'Tap a customer first to start a pizza');renderBoard();}return;}
  if(d.over!=null&&d.over!==d.i)drop(d.i,d.over);else renderBoard();}
$('board').addEventListener('pointerup',endDrag);
$('board').addEventListener('pointercancel',()=>{if(drag){drag.ghost&&drag.ghost.remove();drag=null;renderBoard();}});

function stageStars(){const sat=G.st.satN?G.st.sat/G.st.satN:100;if(G.st.lost===0&&sat>=75)return 3;if(sat>=55&&G.st.lost<=1)return 2;return 1;}

    ${nextOutlet?`<p class="center"><b>🏗️ Next outlet: ${CHAPTERS[G.ch+1].n}</b><br>Unlock it for ${fmt(CHAPTERS[G.ch+1].cost)} 🪙 from the outlet map.</p>`:''}

function fixAfterUpgrade(){
  // apply live upgrades to the running stage
  while(G.ovens.length<ovenCount())G.ovens.push(null);
  const need=COLS*rows();if(G.board.length<need){
    // insert new row above generator row
    const oldRows=G.board.length/COLS,genRow=oldRows-1,add=(need-G.board.length);

    const ng={},nc={};for(const s in G.gens){const ns=+s+add;ng[ns]=G.gens[s];nc[ns]=G.charge[s];}
    G.board=nb;G.gens=ng;G.charge=nc;G.sel=null;sizeBoard();}
  for(const s in G.charge)G.charge[s].n=Math.min(G.charge[s].n+1,genMax());
  renderAll();checkWin();
}

function openDaily(){

  const streak=can?(P.daily.last===yk?Math.min(P.daily.streak+1,7):1):P.daily.streak;
  const rewards=[50,75,100,150,200,300,500];
  openModal(`<button class="close" id="mx">✕</button><h2>🎁 Daily Reward</h2><div class="stat" style="grid-template-columns:repeat(4,1fr)">${rewards.map((r,i)=>`<div class="center" style="${i<streak-(can?1:0)?'background:var(--basilL)':i===streak-1&&can?'outline:3px solid var(--gold)':''}"><small>Day ${i+1}</small><b style="font-size:14px">${r}🪙</b></div>`).join('')}</div>
    ${can?`<button class="btn gold" style="width:100%" id="claim">Claim ${rewards[streak-1]} 🪙</button>`:'<p class="center">✅ Claimed today. Come back tomorrow!</p>'}`);
  $('mx').onclick=closeModal;
  if(can)$('claim').onclick=()=>{P.daily={last:today(),streak};const v=rewards[streak-1];P.coins+=v;save();flyCoins($('claim'),10,v);SFX.win();setTimeout(()=>{closeModal();renderHome();},700);};
}
function openAwards(){

function openSettings(){
  openModal(`<button class="close" id="mx">✕</button><h2>⚙️ Settings</h2>
    <div class="row"><div class="ic">🔊</div><div class="tx"><b>Sound effects</b></div><button class="tog ${P.sound?'on':''}" id="tSnd"></button></div>
    <div class="row"><div class="ic">💾</div><div class="tx"><b>Auto-save</b><small>Progress is saved on this device after every action.</small></div></div>
    <div class="row"><div class="ic">🗑️</div><div class="tx"><b>Reset progress</b><small>Start the empire from scratch.</small></div><button class="btn sm red" id="rst">Reset</button></div>`);
  $('mx').onclick=closeModal;
  $('tSnd').onclick=()=>{P.sound=!P.sound;save();$('tSnd').classList.toggle('on',P.sound);};
  $('rst').onclick=()=>{openModal(`<h2>Reset everything?</h2><p class="center">All coins, stars, outlets, upgrades and staff will be lost.</p>
    <button class="btn red" style="width:100%" id="yes">Yes, reset</button><button class="btn sm" style="width:100%;margin-top:8px;background:#fff;color:var(--ink);box-shadow:none" id="no">Cancel</button>`);
    $('yes').onclick=()=>{try{localStorage.removeItem('pizzaEmpire.v1');}catch(e){}loadSave();closeModal();renderHome();};$('no').onclick=openSettings;};
}

  /* ---------- helpers ---------- */

  const M=(c,o={})=>{const k=c+JSON.stringify(o);return matCache[k]||(matCache[k]=new T.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0},o)));};
  function mesh(g,m,x=0,y=0,z=0,parent){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;if(parent)parent.add(o);return o;}
  const box=(w,h,d)=>new T.BoxGeometry(w,h,d),cyl=(a,b,h,s=24)=>new T.CylinderGeometry(a,b,h,s);
  function textTex(lines,bg,fg,w=512,h=256){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.textAlign='center';

  function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}

    ['#6d4c41','#f8e1c4','#7b1fa2'],['#bdbdbd','#ede7f6','#00897b'],['#8d6e63','#e8f5e9','#43a047'],['#78909c','#fff8e1','#d84315'],['#a1887f','#e1f5fe','#283593'],['#5d4037','#fff8e1','#ffb300']];

      // brick stripes
      for(let k=0;k<3;k++){const r=mesh(new T.TorusGeometry(.56-k*.12,.02,6,24),M('#8e3b22'),0,.9+k*.15,0,g);r.rotation.x=Math.PI/2;}
      mesh(cyl(.08,.1,.5,10),M('#6d4c41'),0,1.55,-.15,g);
      const mouth=mesh(new T.CylinderGeometry(.27,.27,.3,16,1,false,0,Math.PI),M('#1a0f0a'),0,.86,.48,g);mouth.rotation.set(Math.PI/2,0,Math.PI/2);mouth.rotation.z=-Math.PI/2;mouth.rotation.y=0;
      const glow=new T.PointLight(0xff7a1a,0,2.5);glow.position.set(0,.95,.55);g.add(glow);
      const fire=[];for(let k=0;k<3;k++){const f=mesh(new T.ConeGeometry(.06,.18,8),M('#ffb300',{emissive:'#ff6d00',emissiveIntensity:1.5}),-.12+k*.12,.95,.25,g);f.visible=false;fire.push(f);}
      const hit=mesh(box(1.1,1.5,1.1),new T.MeshBasicMaterial({visible:false}),0,.8,0,g);hit.userData.act={t:'oven',i};
      if(!on){const s=mesh(box(.8,.3,.04),new T.MeshStandardMaterial({map:textTex([['LOCKED','bold 80px sans-serif',160]],'#455a64','#fff',512,256)}),0,.45,.52,g);}
      ovenObjs.push({g,glow,fire,on,pizza:null,sig:'',smoke:[]});}
    // pass counter

    mesh(box(.45,.25,.35),M('#37474f'),-2.6,1.18,.55,env);mesh(box(.4,.18,.05),M('#4fc3f7',{emissive:'#0288d1',emissiveIntensity:.4}),-2.6,1.38,.42,env).rotation.x=-.5;
    for(let k=0;k<5;k++)mesh(box(.55,.07,.55),M(k%2?'#d7a86e':'#c8955c'),-4.15,1.09+k*.075,.6,env);

  /* ---------- characters ---------- */
  const SHIRTS=['#e53935','#1e88e5','#43a047','#8e24aa','#fb8c00','#00897b','#6d4c41','#3949ab','#d81b60','#fdd835'];
  const SKINS=['#f1c27d','#e0ac69','#c68642','#8d5524','#ffdbac'];
  function makePerson(o){
    const g=new T.Group();
    const legL=new T.Group(),legR=new T.Group();
    mesh(box(.13,.45,.14),M(o.pants||'#37474f'),0,-.22,0,legL);mesh(box(.13,.45,.14),M(o.pants||'#37474f'),0,-.22,0,legR);

    const armL=new T.Group(),armR=new T.Group();mesh(box(.09,.42,.1),M(o.shirt),0,-.18,0,armL);mesh(box(.09,.42,.1),M(o.shirt),0,-.18,0,armR);

    if(o.hat==='helmet'){mesh(new T.SphereGeometry(.21,12,10,0,Math.PI*2,0,Math.PI/2),M('#e53935',{roughness:.3}),0,1.27,0,g);}

    return g;
  }
  function animPerson(p,dt,mode){const u=p.userData;u.t+=dt;const t=u.t;
    let lw=0,ar=0,by=0;
    if(mode==='walk'){lw=Math.sin(t*9)*.6;ar=-lw*.8;by=Math.abs(Math.sin(t*9))*.05;}
    else if(mode==='sit'){u.legL.rotation.x=u.legR.rotation.x=-1.4;p.position.y=-.02;u.armL.rotation.x=u.armR.rotation.x=-.6;return;}
    else if(mode==='eat'){u.legL.rotation.x=u.legR.rotation.x=-1.4;u.armR.rotation.x=-1.2+Math.sin(t*6)*.5;u.head.position.y=1.24+Math.sin(t*6)*.02;return;}
    else if(mode==='happy'){by=Math.abs(Math.sin(t*8))*.25;ar=-2.6;u.armL.rotation.z=.3;u.armR.rotation.z=-.3;}
    else if(mode==='angry'){lw=Math.sin(t*12)*.6;ar=-lw;u.head.rotation.z=Math.sin(t*20)*.15;}

  function walkTo(p,target,dt,speed=2.4){const d=new T.Vector3(target.x-p.position.x,0,target.z-p.position.z);const L=d.length();

  /* ---------- pizza model with ingredient layers & bake states ---------- */

      // melted blobs
      const r=rng(7);parts.blobs=[];for(let k=0;k<9;k++){const a=r()*6.28,d=r()*(R0-.16);const b=mesh(new T.SphereGeometry(.06,8,5),parts.cheese.material,Math.cos(a)*d,.095,Math.sin(a)*d,g);b.scale.y=.25;parts.blobs.push(b);}}
    // toppings
    let seed=11;for(const t of layers.toppings){const def=TOP[t];if(!def)continue;const r=rng(seed+=37);
      const n=def[0]==='pep'?7:def[0]==='ball'?12:7;for(let k=0;k<n;k++){const a=r()*6.28,d=.06+r()*(R0-.2);
        const m=mesh(TG[def[0]],M(opt.bake>=1.6?'#2b1d14':def[1]),Math.cos(a)*d,.11,Math.sin(a)*d,g);
        if(def[0]==='torus'||def[0]==='ring')m.rotation.x=Math.PI/2;if(def[0]==='leaf')m.scale.set(1,.25,.6);m.rotation.y=r()*6;}}
    if(opt.sliced){for(let k=0;k<4;k++){const c=mesh(box(R0*2+.02,.025,.015),M('#5d4037'),0,.1,0,g);c.rotation.y=k*Math.PI/4;}}
    g.userData.parts=parts;g.userData.R=R0;
    return g;}
  function setBake(p,x){const c=bakeColors(x),P=p.userData.parts;if(P.base){P.base.material.color.copy(c.dough);P.crust.material.color.copy(c.dough);}

    const lid=mesh(box(.95,.03,.95),new T.MeshStandardMaterial({map:textTex([['🍕','150px sans-serif',150],['PIZZA EMPIRE','bold 40px sans-serif',230]],'#d7a86e','#b71c1c',256,256)}),0,.135,0,g);lid.rotation.y=Math.PI/2;return g;}
  function layersFor(r,filled){const need=R[r].need;const L={need,has:[],base:false,sauce:false,cheese:false,toppings:[]};

  /* ---------- particles ---------- */

  const sparks=[];
  function sparkle(x,y,z){for(let k=0;k<10;k++){const m=new T.Mesh(new T.OctahedronGeometry(.05),new T.MeshBasicMaterial({color:k%2?'#ffd54f':'#fff176'}));m.position.set(x,y,z);dyn.add(m);
    sparks.push({m,life:.8,v:new T.Vector3((Math.random()-.5)*2.5,1.5+Math.random()*1.5,(Math.random()-.5)*2.5)});}}

  /* ---------- actors synced with orders ---------- */
  const actors=new Map(),leaving=[],mood={};
  const DOOR=new T.Vector3(7.5,0,2.8),DOOR_IN=new T.Vector3(5.6,0,2.8);
  function queueSpot(k){return new T.Vector3(-3.4+(k%3)*.7-.7,0,1.55+Math.floor(k/3)*.8);}
  function riderSpot(k){return new T.Vector3(4.9-k*.1,0,3.4-k*.0);}
  function syncActors(dt){
    if(!G)return;
    const ids=new Set(G.orders.map(o=>o.id));

    for(const [id,a] of actors){if(!ids.has(id)){actors.delete(id);a.mood=mood[id]||'happy';a.leaveT=a.mood==='happy'?1.0:0.6;
      if(a.mood==='happy')sparkle(a.p.position.x,1.6,a.p.position.z);if(a.plate){dyn.remove(a.plate);a.plate=null;}leaving.push(a);}}
    // add new
    const usedSeats=new Set();for(const a of actors.values())if(a.seat)usedSeats.add(a.seat);
    let q=0;
    for(const o of G.orders){let a=actors.get(o.id);
      if(!a){const isR=o.type==='deliv';const p=makePerson({shirt:isR?'#ff7043':SHIRTS[o.id%SHIRTS.length],skin:SKINS[o.id%SKINS.length],hat:isR?'helmet':o.vip?'crown':null,pants:o.vip?'#4a148c':null,hair:['#3e2723','#212121','#795548','#ffca28'][o.id%4]});
        p.position.copy(DOOR);dyn.add(p);a={p,o,seat:null,scooter:null};

        if(isR){const s=makeScooter();s.position.copy(DOOR);dyn.add(s);a.scooter=s;}
        actors.set(o.id,a);}
      a.o=o;
      let target;
      if(o.type==='dine'){if(!a.seat){for(const t of tableSpots){for(const s of t.seats){const k=s.x+','+s.z;if(!usedSeats.has(k)){a.seat=k;a.seatV=s;a.table=t;usedSeats.add(k);break;}}if(a.seat)break;}}
        target=a.seatV||DOOR_IN;}
      else if(o.type==='deliv')target=riderSpot(0);
      else target=queueSpot(q++);
      const p=a.p;
      if(o.type==='deliv'){
        if(o.state==='deliv'){a.gone=(a.gone||0)+dt;a.scooter.position.x+=dt*4;p.position.copy(a.scooter.position);p.position.y=.25;p.rotation.y=Math.PI/2;a.scooter.rotation.y=Math.PI/2;
          if(!a.boxOn){a.boxOn=makeBox();a.boxOn.scale.setScalar(.5);a.boxOn.position.set(-.45,.55,0);a.scooter.add(a.boxOn);}
          animPerson(p,dt,'sit');continue;}
        const moving=walkTo(a.scooter,target,dt,3);p.position.set(a.scooter.position.x,.25,a.scooter.position.z);p.rotation.y=a.scooter.rotation.y=moving?a.scooter.rotation.y:-Math.PI/2;
        animPerson(p,dt,'sit');continue;}
      const moving=walkTo(p,target,dt);
      if(moving){animPerson(p,dt,'walk');continue;}
      if(o.type==='dine'&&a.seatV){p.rotation.y=a.seatV.x<a.table.x?Math.PI/2:-Math.PI/2;
        if(o.state==='eat'){if(!a.plate){a.plate=makePizza(layersFor(o.r,null),{bake:1.2,sliced:true});a.plate.scale.setScalar(.6);a.plate.position.set(a.table.x+(a.seatV.x<a.table.x?-.15:.15),.82,a.table.z);dyn.add(a.plate);}
          animPerson(p,dt,'eat');a.plate.rotation.y+=dt*.2;}
        else animPerson(p,dt,'sit');p.position.y=-.02;}
      else{p.rotation.y=Math.PI;animPerson(p,dt,o.pat/o.maxPat<.25?'angry':'idle');}
    }
    for(const a of [...leaving]){const p=a.p;a.leaveT-=dt;
      if(a.leaveT>0){animPerson(p,dt,a.mood);p.rotation.y=0;continue;}
      const tgt=a.scooter?new T.Vector3(9,0,a.scooter.position.z):DOOR;
      if(a.scooter){a.scooter.position.x+=dt*4;p.position.set(a.scooter.position.x,.25,a.scooter.position.z);}
      else{walkTo(p,tgt,dt,2.8);animPerson(p,dt,'walk');}
      if(p.position.x>7.2){dyn.remove(p);if(a.scooter)dyn.remove(a.scooter);leaving.splice(leaving.indexOf(a),1);}}
  }
  function makeScooter(){const g=new T.Group();mesh(box(.9,.12,.3),M('#e53935',{roughness:.3}),0,.28,0,g);
    for(const x of[-.35,.35]){const w=mesh(new T.TorusGeometry(.13,.05,8,16),M('#212121'),x,.15,0,g);}
    mesh(box(.08,.5,.08),M('#757575'),.38,.5,0,g);mesh(box(.06,.06,.4),M('#424242'),.4,.75,0,g);
    mesh(box(.35,.3,.35),M('#ffb300'),-.35,.5,0,g);return g;}

  /* ---------- kitchen sync ---------- */
  const trayObjs=new Map();
  function syncKitchen(dt){
    if(!G)return;
    // prep table pizza mirrors the counter
    const sig=G.asm?G.asm.r+':'+G.asm.filled.join(''):'';
    if(sig!==prepSig){if(prepPizza){dyn.remove(prepPizza);prepPizza=null;}
      if(G.asm&&G.asm.filled.some(Boolean)){prepPizza=makePizza(layersFor(G.asm.r,G.asm.filled),{bake:0});prepPizza.position.set(PREP.x,.95,PREP.z+.1);dyn.add(prepPizza);
        if(prepSig&&sig.length===prepSig.length)sparkle(PREP.x,1.1,PREP.z+.1);chefChopT=.6;}

    ovenObjs.forEach((ob,i)=>{const ov=G.ovens[i];
      const s=ov?ov.pid:'';if(ob.sig!==s){if(ob.pizza){ob.g.remove(ob.pizza);ob.pizza=null;}

      const x=ov?ov.t/ov.bake:0;
      if(ob.pizza)setBake(ob.pizza,x);
      ob.glow.intensity=ov?1.6+Math.sin(performance.now()/120)*.4:0;ob.fire.forEach((f,k)=>{f.visible=!!ov;f.scale.y=1+Math.sin(performance.now()/90+k)*.3;});
      if(ov&&x>=1.6&&Math.random()<dt*8)puff(OVEN_X[i],1.2,-2.2,'#424242');
      else if(ov&&x>=1&&x<1.6&&Math.random()<dt*4)puff(OVEN_X[i],1.15,-2.25,'#ffffff');});

    const seen=new Set();G.tray.forEach((p,k)=>{seen.add(p.pid);let t=trayObjs.get(p.pid);const s=p.step+p.q;

        m.scale.setScalar(.75);m.traverse(c=>{if(c.isMesh)c.userData.act={t:'tray',pid:p.pid};});dyn.add(m);if(t)sparkle(m.position.x,1.2,PASS_Z);t={m,s};trayObjs.set(p.pid,t);}

  }

    cam.fov=w/h<1.6?52:40;cam.updateProjectionMatrix();}}
  function reset(){for(const a of actors.values()){dyn.remove(a.p);if(a.scooter)dyn.remove(a.scooter);if(a.plate)dyn.remove(a.plate);}actors.clear();
    for(const a of leaving){dyn.remove(a.p);if(a.scooter)dyn.remove(a.scooter);}leaving.length=0;

    {id:'tables2',n:'Patio Tables',ic:'🪑',cost:300,x:8.6,z:3.6},
    {id:'helper2',n:'Hire Baker',ic:'👩‍🍳',cost:380,x:-1.8,z:-1.4,hire:1},
    {id:'speed',n:'Running Shoes',ic:'👟',cost:260,x:-3.4,z:4.6},

  }
  ITEM.coin={h:.055,make(){return mesh(G_.coin,M('#ffd23f',{roughness:.35,emissive:'#b37400',emissiveIntensity:.35}));}};

  function buildRoom(){
    const th=W.th,b=W.bounds;W.roomG.clear();W.obst=W.obst.filter(o=>!o.wall);
    const w=b.x1-b.x0,d=b.z1-b.z0,cx=(b.x0+b.x1)/2,cz=(b.z0+b.z1)/2;
    const tex=canvasTex(128,128,(x)=>{x.fillStyle=th.floor;x.fillRect(0,0,128,128);x.fillStyle='rgba(0,0,0,.05)';x.fillRect(0,0,64,64);x.fillRect(64,64,64,64);});
    tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.repeat.set(w/2,d/2);
    const f=mesh(new T.PlaneGeometry(w,d),new T.MeshStandardMaterial({map:tex,roughness:.9}),cx,.01,cz,W.roomG);f.rotation.x=-Math.PI/2;f.castShadow=false;
    const seg=(x0,z0,x1,z1)=>{const hz=Math.abs(z1-z0)<.01,l=hz?Math.abs(x1-x0):Math.abs(z1-z0);if(l<=0)return;
      const g=new T.Group();g.position.set((x0+x1)/2,0,(z0+z1)/2);if(!hz)g.rotation.y=Math.PI/2;W.roomG.add(g);
      const H=W.low?.4:.9;mesh(box(l+.3,H,.3),M(th.wall),0,H/2,0,g);mesh(box(l+.32,.12,.32),M(th.stripe),0,H*.4,0,g);mesh(box(l+.34,.06,.34),M('#ffcc80'),0,H+.02,0,g);
      W.obst.push({wall:1,x0:Math.min(x0,x1)-(hz?0:.18),x1:Math.max(x0,x1)+(hz?0:.18),z0:Math.min(z0,z1)-(hz?.18:0),z1:Math.max(z0,z1)+(hz?.18:0)});};
    seg(b.x0,b.z0,b.x1,b.z0);seg(b.x0,b.z0,b.x0,b.z1);seg(b.x1,b.z0,b.x1,b.z1);W.low=1;seg(b.x0,b.z1,-1.1,b.z1);seg(1.1,b.z1,b.x1,b.z1);W.low=0;
    for(const sx of[-1,1])mesh(box(.3,.8,.4),M(th.stripe),sx*1.1,.4,b.z1,W.roomG);

  }

  function addDrink(anim){const g=new T.Group();g.position.set(-4.35,0,-.6);W.root.add(g);
    mesh(box(.8,1.6,1.1),M('#e53935',{roughness:.4}),0,.8,0,g);mesh(box(.05,.9,.8),M('#81d4fa',{emissive:'#0288d1',emissiveIntensity:.35}),.41,1.0,0,g);

  function addOven(id,x,out,anim){const g=new T.Group();g.position.set(x,0,-3.6);W.root.add(g);

    const glow=new T.PointLight(0xff7a1a,0,3);glow.position.set(0,1,.9);g.add(glow);
    const fire=mesh(new T.ConeGeometry(.12,.25,8),M('#ffb300',{emissive:'#ff6d00',emissiveIntensity:1.5}),0,.95,.45,g);fire.visible=false;

  function addCounter(){const g=new T.Group();g.position.set(0,0,1.6);W.root.add(g);
    mesh(box(3.4,.95,.7),M(W.th.stripe),0,.47,0,g);mesh(box(3.5,.08,.8),M('#fafafa'),0,.98,0,g);
    mesh(box(.45,.3,.35),M('#37474f'),1.45,1.17,-.05,g);
    const piles={pizza:new Pile('pizza',14,g,-.9,1.02,0,2),drink:new Pile('drink',10,g,.05,1.02,0,2),bread:new Pile('bread',10,g,.85,1.02,0,1)};
    W.stations.counter={g,type:'counter',piles,spot:V(0,.75),cust:V(0,2.6)};W.obst.push({x0:-1.75,x1:1.75,z0:1.2,z1:2.0});}
  function addCashMat(){const g=new T.Group();g.position.set(2.6,0,1.0);W.root.add(g);
    const mat=mesh(box(1.1,.03,1.1),M('#4e342e'),0,.02,0,g);mat.castShadow=false;

    W.stations.trash={g,type:'trash',spot:V(-2.4,.6)};W.obst.push({x0:-2.7,x1:-2.1,z0:.3,z1:.9});}
  function addTable(id,x,z,anim){const g=new T.Group();g.position.set(x,0,z);W.root.add(g);
    mesh(box(1.2,.08,.9),M('#d7a86e'),0,.72,0,g);mesh(box(1.1,.02,.8),M('#fff8e1'),0,.77,0,g);
    for(const lx of[-.5,.5])for(const lz of[-.35,.35])mesh(box(.07,.7,.07),M('#6d4c41'),lx,.35,lz,g);
    const seats=[];for(const sx of[-1,1]){mesh(box(.42,.06,.42),M(W.th.stripe),sx*.95,.45,0,g);mesh(box(.06,.5,.42),M(W.th.stripe),sx*1.15,.7,0,g);seats.push({pos:V(x+sx*.95,z),face:-sx,occ:null});}
    W.stations[id]={g,type:'table',seats,x,z};W.obst.push({x0:x-.65,x1:x+.65,z0:z-.5,z1:z+.5});if(anim)popIn(g);}
  function addHelper(id,anim){const p=S3.makePerson({shirt:id==='helper1'?'#1e88e5':'#8e24aa',skin:'#e0ac69',hat:'chef',pants:'#37474f'});

  /* ---------- unlock ---------- */
  function unlock(id,silent){
    const a=!silent;
    switch(id){
      case 'oven1':addOven('oven1',-.6,'pizza',a);break;
      case 'oven2':addOven('oven2',1.8,'pizza',a);break;
      case 'bread':addOven('bread',8,'bread',a);break;
      case 'drink':addDrink(a);break;
      case 'table1':addTable('table1',3.4,3.3,a);break;
      case 'table2':addTable('table2',3.4,5.2,a);break;
      case 'tables2':addTable('tables2a',8.6,2.6,a);addTable('tables2b',8.6,4.7,a);break;
      case 'helper1':case 'helper2':addHelper(id,a);break;
      case 'cap1':W.player.cap=7;W.player.stack.max=7;break;
      case 'cap2':W.player.cap=10;W.player.stack.max=10;break;
      case 'speed':W.player.speed=5.6;break;
      case 'expand':W.bounds.x1=11.5;buildRoom();if(a){W.shake=.5;for(let k=0;k<14;k++)W.fx.push(glowPillar(5,-4+k*.75));}break;
      case 'next':break;
    }
  }
  function glowPillar(x,z){const m=new T.Mesh(cyl(.25,.25,3,8,true),new T.MeshBasicMaterial({color:'#fff59d',transparent:true,opacity:.8,side:T.DoubleSide}));m.position.set(x,1.5,z);W.root.add(m);
    return{t:0,f:(t)=>{m.material.opacity=Math.max(0,.8-t*.5);m.scale.y=1+t;if(t>1.6){W.root.remove(m);return true;}return false;}};}
  function confetti(x,y,z){for(let k=0;k<22;k++){const m=new T.Mesh(box(.08,.08,.02),new T.MeshBasicMaterial({color:['#ffc233','#e53935','#43a047','#1e88e5','#fff'][k%5]}));
    m.position.set(x,y,z);W.root.add(m);const v=new T.Vector3((Math.random()-.5)*4,3+Math.random()*3,(Math.random()-.5)*4);
    W.fx.push({t:0,f:(t,dt)=>{v.y-=9*dt;m.position.addScaledVector(v,dt);m.rotation.x+=dt*9;m.rotation.y+=dt*7;if(t>1.6){W.root.remove(m);return true;}return false;}});}}

  /* ---------- pads ---------- */
  function padTex(p,paid){const cost=padCost(p);return canvasTex(256,256,(x,w,h)=>{
    x.fillStyle='#4e342e';rr(x,6,6,w-12,h-12,36);x.fill();
    x.strokeStyle='#ffc233';x.lineWidth=10;x.beginPath();const fr=paid/cost;
    x.globalAlpha=.25;rr(x,14,14,w-28,h-28,30);x.stroke();x.globalAlpha=1;
    x.save();x.beginPath();x.rect(0,h*(1-fr),w,h*fr);x.clip();rr(x,14,14,w-28,h-28,30);x.stroke();x.restore();
    x.textAlign='center';x.fillStyle='#fff';x.font='70px sans-serif';x.fillText(p.ic,w/2,95);
    x.font='bold 26px sans-serif';x.fillText(p.n.toUpperCase(),w/2,140);
    x.fillStyle='#ffc233';x.font='bold 46px sans-serif';x.fillText('🪙 '+fmt(cost-paid),w/2,205);});}
  function refreshPads(){
    for(const id in W.pads){W.root.remove(W.pads[id].m);}W.pads={};
    const done=SV().done;let shown=0;
    for(const p of PADS){if(done.includes(p.id))continue;if(shown>=2)break;
      if((p.id==='bread'||p.id==='tables2'||p.id==='cap2'||p.id==='next')&&!done.includes('expand'))continue;
      shown++;const s=p.big?2.2:1.7;
      const m=mesh(box(s,.04,s),new T.MeshStandardMaterial({map:padTex(p,0),roughness:.6}),p.x,.03,p.z,W.root);m.castShadow=false;
      W.pads[p.id]={p,m,paid:0,dirty:0};}
    const n=done.length;$('tyStage').textContent=`Stage ${Math.min(n+1,PAD_TOTAL)}/${PAD_TOTAL}`;$('tyBar').style.width=(n/PAD_TOTAL*100)+'%';
    $('tyName').textContent=W.th.n+(SV().lvl>=10?' ★'+Math.floor(SV().lvl/10):'');
  }

  /* ---------- coins on player's back ---------- */
  function updateCoinTower(){const c=SV().coins;W.player.coinPile.n=Math.min(30,Math.ceil(c/Math.max(2,4*mult())));W.player.coinPile.sync();$('tyCoins').textContent=fmt(c);}

  /* ---------- movement + collisions ---------- */
  function collide(pos,r){const b=W.bounds;pos.x=Math.max(b.x0+.4,Math.min(b.x1-.4,pos.x));
    pos.z=Math.max(b.z0+.4,Math.min(b.z1-.4,pos.z));
    for(const o of W.obst){const cx=Math.max(o.x0,Math.min(o.x1,pos.x)),cz=Math.max(o.z0,Math.min(o.z1,pos.z));const dx=pos.x-cx,dz=pos.z-cz,d=Math.hypot(dx,dz);
      if(d<r){if(d>1e-4){pos.x=cx+dx/d*r;pos.z=cz+dz/d*r;}else{pos.z=o.z1+r;}}}}
  function moveActor(a,dir,dt,speed){const p=a.p;const L=dir.length();
    if(L>.05){const v=dir.clone().normalize().multiplyScalar(speed*Math.min(1,L));p.position.addScaledVector(v,dt);collide(p.position,.32);
      p.rotation.y=Math.atan2(v.x,v.z);S3.animPerson(p,dt,'walk');p.userData.walking=1;}
    else{S3.animPerson(p,dt,'idle');p.userData.walking=0;}
    // carry pose
    if(a.stack.n>0){p.userData.armL.rotation.x=p.userData.armR.rotation.x=-1.35;}}
  function goTo(a,target,dt){const d=new T.Vector3(target.x-a.p.position.x,0,target.z-a.p.position.z);if(d.length()<.25){moveActor(a,new T.Vector3(),dt,a.speed);return true;}
    moveActor(a,d.normalize(),dt,a.speed);return false;}

  /* ---------- interactions (same rules for player & helpers) ---------- */
  const near=(a,spot,r=.95)=>Math.hypot(a.p.position.x-spot.x,a.p.position.z-spot.z)<r;
  function interact(a,dt){
    a.cd-=dt;if(a.cd>0)return;const S=W.stations,st=a.stack;let did=false;
    const take=(pile)=>{if(pile.n>0&&st.n<a.cap&&(st.n===0||st.type===pile.type)){if(st.n===0){st.type=pile.type;}pile.take();st.add();did=true;SFX.pop();}};
    const give=(pile)=>{if(st.n>0&&st.type===pile.type&&pile.n<pile.max){st.take();pile.add();if(st.n===0)st.type=null;did=true;SFX.pop();}};
    for(const k in S){const s=S[k];if(!s.spot||!near(a,s.spot))continue;
      if(s.type==='src')take(s.pile);
      else if(s.type==='oven'){if(st.type==='dough')give(s.in);else take(s.out);}
      else if(s.type==='counter'){if(st.n&&s.piles[st.type])give(s.piles[st.type]);}
      else if(s.type==='trash'&&a.isPlayer&&st.n){st.take();if(!st.n)st.type=null;did=true;}
      else if(s.type==='cash'&&a.isPlayer&&s.coins>0){collectCash();did=true;}
      if(did)break;}
    a.cd=did?.11:0;
  }
  function collectCash(){const c=W.stations.cash;const v=c.coins;c.coins=0;c.piles.forEach(p=>{p.n=0;p.sync();});
    SV().coins+=v;flyHud(c.g.position,Math.min(12,4+v/10));SFX.coin();updateCoinTower();saveSoon();}
  function addCash(v){const c=W.stations.cash;c.coins+=v;let left=Math.min(56,Math.ceil(c.coins/Math.max(2,3*mult())));c.piles.forEach(p=>{p.n=Math.min(14,left);left-=p.n;p.sync();});}
  function flyHud(pos,n){const v=pos.clone();v.y=1;v.project(cam);const r=canvas.getBoundingClientRect();
    const fake={getBoundingClientRect:()=>({left:r.left+(v.x+1)/2*r.width-10,top:r.top+(1-v.y)/2*r.height-10,width:20,height:20})};flyCoins(fake,Math.round(n));}

  /* ---------- helper AI ---------- */
  function helperAI(h,dt){
    const S=W.stations,ovens=['oven1','oven2','bread'].filter(k=>S[k]);
    if(h.role==='runner'){
      if(h.stack.n>0&&(h.stack.n>=h.cap||!ovens.some(k=>S[k].out.n>0&&S[k].out.type===h.stack.type))){goTo(h,S.counter.spot,dt);interact(h,dt);return;}
      const o=ovens.filter(k=>S[k].out.n>0&&(h.stack.n===0||S[k].out.type===h.stack.type)).sort((a,b)=>S[b].out.n-S[a].out.n)[0];
      if(o){goTo(h,S[o].spot,dt);interact(h,dt);}else if(h.stack.n>0){goTo(h,S.counter.spot,dt);interact(h,dt);}else{goTo(h,V(1.4,-.6),dt);}
    }else{
      if(h.stack.n>0){const o=ovens.filter(k=>S[k].in.n<S[k].in.max).sort((a,b)=>S[a].in.n-S[b].in.n)[0];if(o){goTo(h,S[o].spot,dt);interact(h,dt);}else moveActor(h,new T.Vector3(),dt,0);}
      else{goTo(h,S.flour.spot,dt);interact(h,dt);}
    }
  }

  /* ---------- customers ---------- */
  const FACES2=['#e53935','#1e88e5','#43a047','#8e24aa','#fb8c00','#00897b','#fdd835','#6d4c41','#3949ab','#d81b60'];
  function bubbleTex(c){return canvasTex(256,128,(x,w,h)=>{x.fillStyle=c.angry?'#ffcdd2':'#fff';rr(x,6,6,w-12,h-30,26);x.fill();
    x.beginPath();x.moveTo(w/2-14,h-25);x.lineTo(w/2,h-4);x.lineTo(w/2+14,h-25);x.fill();
    x.font='bold 44px sans-serif';x.textAlign='center';x.fillStyle='#3b2414';
    const parts=[];for(const k of['pizza','drink','bread'])if(c.need[k]>0)parts.push(ITEM[k].icon+c.need[k]);
    x.fillText(c.state==='eat'?'😋':c.state==='leave'?(c.angry?'😠':'😍'):(c.angry?'😠 ':'')+parts.join(' '),w/2,72);});}
  function spawnCustomer(){
    const lvl=SV().lvl;const need={pizza:1+(Math.random()<.45?1:0)+(lvl>2&&Math.random()<.25?1:0),drink:W.stations.drink&&Math.random()<.5?1:0,bread:W.stations.bread&&Math.random()<.4?1:0};
    const p=S3.makePerson({shirt:FACES2[Math.floor(Math.random()*10)],skin:['#f1c27d','#e0ac69','#c68642','#8d5524','#ffdbac'][Math.floor(Math.random()*5)],hair:['#3e2723','#212121','#795548','#ffca28'][Math.floor(Math.random()*4)]});
    p.position.set(0,0,9);W.root.add(p);
    const c={p,need,state:'queue',wait:0,angry:false,sprite:null,sig:'',pay:0,cd:0};
    const sp=new T.Sprite(new T.SpriteMaterial({map:bubbleTex(c),depthTest:false}));sp.scale.set(1.3,.65,1);sp.position.y=2.15;p.add(sp);c.sprite=sp;
    W.customers.push(c);
  }
  function customersAI(dt){
    const S=W.stations,q=W.customers.filter(c=>c.state==='queue');
    q.forEach((c,i)=>{const tgt=V(0,2.6+i*.85);const at=Math.hypot(c.p.position.x-tgt.x,c.p.position.z-tgt.z)<.1;
      if(!at){const d=V(tgt.x-c.p.position.x,tgt.z-c.p.position.z);const L=d.length();c.p.position.addScaledVector(d.normalize(),Math.min(L,2.6*dt));c.p.rotation.y=Math.atan2(d.x,d.z);S3.animPerson(c.p,dt,'walk');}
      else{c.p.rotation.y=Math.PI;S3.animPerson(c.p,dt,c.angry?'angry':'idle');c.wait+=dt;if(c.wait>28)c.angry=true;
        if(i===0){c.cd-=dt;if(c.cd<=0){for(const k of['pizza','drink','bread']){if(c.need[k]>0&&S.counter.piles[k].n>0){S.counter.piles[k].take();c.need[k]--;c.pay+=PRICE[k];c.cd=.28;SFX.pop();break;}}}
          if(c.need.pizza+c.need.drink+c.need.bread===0){const seat=freeSeat();
            const amount=Math.round(c.pay*mult()*(c.angry?.8:1));
            if(seat){seat.occ=c;c.seat=seat;c.state='toSeat';c.amount=Math.round(amount*1.5);}else{addCash(amount);c.state='leave';SFX.coin();}}}}});
    for(const c of [...W.customers]){
      if(c.state==='toSeat'){const t=c.seat.pos;const d=V(t.x-c.p.position.x,t.z-c.p.position.z);const L=d.length();
        if(L>.08){c.p.position.addScaledVector(d.normalize(),Math.min(L,2.6*dt));c.p.rotation.y=Math.atan2(d.x,d.z);S3.animPerson(c.p,dt,'walk');}
        else{c.state='eat';c.eat=3.5;c.p.rotation.y=c.seat.face>0?Math.PI/2:-Math.PI/2;c.food=ITEM.pizza.make();c.food.position.set(t.x+c.seat.face*.45,.82,t.z);W.root.add(c.food);}}
      else if(c.state==='eat'){c.eat-=dt;S3.animPerson(c.p,dt,'eat');c.p.position.y=-.02;if(c.eat<=0){W.root.remove(c.food);c.seat.occ=null;
          // dine-in pays at the table: coins pile up on the cash mat
          addCash(c.amount);SFX.coin();c.state='leave';}}
      else if(c.state==='leave'){const t=c.p.position.z<6.5?V(0,6.9):V(0,9.5);const d=V(t.x-c.p.position.x,t.z-c.p.position.z);const L=d.length();
        c.p.position.addScaledVector(d.normalize(),Math.min(L,2.8*dt));c.p.rotation.y=Math.atan2(d.x,d.z);S3.animPerson(c.p,dt,'walk');
        if(L<.2&&t.z>9){W.root.remove(c.p);W.customers.splice(W.customers.indexOf(c),1);}}
      const sig=c.state+c.angry+c.need.pizza+c.need.drink+c.need.bread;if(sig!==c.sig){c.sig=sig;c.sprite.material.map=bubbleTex(c);c.sprite.material.needsUpdate=true;c.sprite.visible=c.state!=='toSeat';}
    }
  }
  function freeSeat(){for(const k in W.stations){const s=W.stations[k];if(s.type!=='table')continue;for(const se of s.seats)if(!se.occ)return se;}return null;}

  /* ---------- pads interaction ---------- */
  function padTick(dt){W.padT-=dt;
    for(const id in W.pads){const pd=W.pads[id],p=pd.p,cost=padCost(p);const s=p.big?1.1:.85;
      const on=Math.abs(W.player.p.position.x-p.x)<s&&Math.abs(W.player.p.position.z-p.z)<s;
      pd.m.position.y=.03+(on?.02:0);
      if(on&&SV().coins>0&&W.padT<=0){const step=Math.min(SV().coins,cost-pd.paid,Math.max(1,Math.ceil(cost/35)));pd.paid+=step;SV().coins-=step;W.padT=.045;
        coinToPad(p);updateCoinTower();pd.dirty=1;
        if(pd.paid>=cost){complete(id);return;}}
      if(pd.dirty&&(pd.t=(pd.t||0)+dt)>.08){pd.t=0;pd.dirty=0;pd.m.material.map=padTex(p,pd.paid);pd.m.material.needsUpdate=true;}}}
  function coinToPad(p){const m=ITEM.coin.make();const from=W.player.p.position.clone();from.y=1.3;m.position.copy(from);W.root.add(m);const to=V(p.x,p.z);to.y=.1;
    W.fx.push({t:0,f:(t)=>{const k=Math.min(1,t*4);m.position.lerpVectors(from,to,k);m.position.y+=Math.sin(k*Math.PI)*.8;if(k>=1){W.root.remove(m);return true;}return false;}});if(Math.random()<.3)SFX.coin();}
  function complete(id){SV().done.push(id);W.root.remove(W.pads[id].m);delete W.pads[id];SFX.unlock();vib(40);
    const p=PADS.find(x=>x.id===id);confetti(p.x,.5,p.z);
    if(id==='next'){save();levelDone();return;}
    unlock(id,false);refreshPads();save();
    banner(`${p.ic} ${p.n} unlocked!`);}
  function banner(t){const b=$('tyBanner');b.textContent=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
  function levelDone(){
    running=false;const th=W.th;const nxt=THEMES[(SV().lvl+1)%THEMES.length];
    openModal(`<div class="rain">${coinRain(36)}</div><h2>Restaurant Complete!</h2><div class="hq">🏆</div>
      <p class="center"><b>${th.n}</b> is fully built.<br>Next up: <b>${nxt.n}</b> 🍕</p>
      <button class="btn gold" style="width:100%" id="tyNext">Open ${nxt.n} ▶</button>`);modalLock(true);
    $('tyNext').onclick=()=>{modalLock(false);closeModal();SV().lvl++;SV().done=[];save();build();running=true;last=performance.now();loop(last);};
  }

  /* ---------- input: joystick + keyboard ---------- */
  const joy={on:false,ox:0,oy:0,dx:0,dy:0},keys={};
  canvas.addEventListener('pointerdown',e=>{audio();joy.on=true;joy.ox=e.clientX;joy.oy=e.clientY;joy.dx=joy.dy=0;canvas.setPointerCapture(e.pointerId);
    const b=$('joyBase');b.style.display='block';b.style.left=(e.clientX-50)+'px';b.style.top=(e.clientY-50)+'px';$('joyKnob').style.transform='translate(0,0)';});
  canvas.addEventListener('pointermove',e=>{if(!joy.on)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const L=Math.hypot(dx,dy),R=45;if(L>R){dx=dx/L*R;dy=dy/L*R;}
    joy.dx=dx/R;joy.dy=dy/R;$('joyKnob').style.transform=`translate(${dx}px,${dy}px)`;});
  const end=()=>{joy.on=false;joy.dx=joy.dy=0;$('joyBase').style.display='none';};
  canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
  addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});

  /* ---------- main loop ---------- */
  let running=false,last=0,saveT=0;
  function saveSoon(){saveT=1;}
  function hint(){const S=W.stations,st=W.player.stack,d=SV().done;let t='';
    if(!d.includes('oven1'))t='👣 Walk onto the glowing pad to build your oven';
    else if(st.n===0&&S.cash.coins>0)t='🪙 Walk over the coins to collect them';
    else if(st.n===0)t='⚪ Grab dough from the DOUGH crate';
    else if(st.type==='dough')t='🔥 Bring the dough to an oven';
    else t='🍕 Put it on the counter for customers';
    $('tyHint').textContent=t;}
  function loop(ts){if(!running)return;requestAnimationFrame(loop);
    const dt=Math.min(.1,(ts-last)/1000);last=ts;if($('modalBg').classList.contains('on'))return;
    resize();
    const S=W.stations;
    // sources & ovens
    for(const k in S){const s=S[k];
      if(s.type==='src'){if(s.pile.n<s.pile.max){s.t+=dt;if(s.t>=s.rate){s.t=0;s.pile.add();}}}
      if(s.type==='oven'){const busy=s.in.n>0&&s.out.n<s.out.max;s.glow.intensity=busy?1.6+Math.sin(ts/120)*.4:0;s.fire.visible=busy;
        if(busy){s.t+=dt;if(s.t>=s.bake){s.t=0;s.in.take();s.out.add();}}}}
    for(const k in S){const s=S[k];if(s.pile)s.pile.anim(dt);if(s.in){s.in.anim(dt);s.out.anim(dt);}if(s.piles){for(const p of Object.values(s.piles))p.anim(dt);}}
    // player
    const dir=new T.Vector3(joy.dx+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),0,joy.dy+((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0));
    moveActor(W.player,dir,dt,W.player.speed);interact(W.player,dt);W.player.stack.anim(dt);W.player.coinPile.anim(dt);
    for(const h of W.helpers){helperAI(h,dt);h.stack.anim(dt);}
    // customers
    W.spawnT-=dt;const maxQ=has('expand')?6:4;
    if(W.spawnT<=0&&W.customers.filter(c=>c.state==='queue').length<maxQ&&has('oven1')){spawnCustomer();W.spawnT=Math.max(2.5,7-SV().done.length*.3);}
    customersAI(dt);padTick(dt);
    for(const f of [...W.fx]){f.t+=dt;if(f.f(f.t,dt))W.fx.splice(W.fx.indexOf(f),1);}
    // camera follow
    const pp=W.player.p.position;const aspect=cam.aspect;const back=aspect<.8?9.5:8,up=aspect<.8?14:10;
    const want=new T.Vector3(pp.x,up,pp.z+back);cam.position.lerp(want,Math.min(1,dt*4));
    if(W.shake>0){W.shake-=dt;cam.position.x+=(Math.random()-.5)*.2;}
    cam.lookAt(cam.position.x,0,cam.position.z-back+.3);
    sun.position.set(pp.x+5,12,pp.z+6);sun.target.position.set(pp.x,0,pp.z);
    hint();
    saveT-=dt;if(saveT<=0&&saveT>-1){save();saveT=-2;}
    renderer.render(scene,cam);
  }
  let cw=0,ch=0;function resize(){const r=canvas.getBoundingClientRect();if(r.width!==cw||r.height!==ch){cw=r.width;ch=r.height;renderer.setSize(cw,ch,false);cam.aspect=cw/ch;cam.updateProjectionMatrix();}}

  function start(){show('tycoon');setCoins();if(!W)build();else{refreshPads();updateCoinTower();}running=true;last=performance.now();requestAnimationFrame(loop);}
  function stop(){running=false;save();}
  return{start,stop,info:()=>{const s=SV();return{lvl:s.lvl,stage:Math.min(s.done.length+1,PAD_TOTAL),total:PAD_TOTAL,name:THEMES[s.lvl%THEMES.length].n};},debug:()=>W};
})();

if(TY)$('tyBack').onclick=()=>{TY.stop();renderHome();show('home');};
</script>
</body>
</html>
