name: Build Pizza Empire APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --org com.sameer --project-name pizza_empire --platforms android,ios .

      - name: Set app name and vibration permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="pizza_empire"/android:label="Pizza Empire"/' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' $M

      - name: Use the fixed release signing key (so updates install over old versions)
        if: ${{ env.KS != '' }}
        run: |
          echo "$KS" | base64 -d > android/app/upload.jks
          python3 - <<'PY'
          p='android/app/build.gradle.kts'
          s=open(p).read()
          sign='''    signingConfigs {
                  create("release") {
                      storeFile = file("upload.jks")
                      storePassword = System.getenv("KS_PW")
                      keyAlias = "pizzaempire"
                      keyPassword = System.getenv("KS_PW")
                  }
              }
          '''
          assert '    buildTypes {' in s
          s=s.replace('    buildTypes {', sign+'    buildTypes {',1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
          open(p,'w').write(s)
          print('release signing enabled')
          PY

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pizza-empire-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pizza Empire v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
